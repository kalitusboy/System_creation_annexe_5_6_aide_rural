name: HabitatRural v3 – Build & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore & Build
      run: |
        dotnet restore HabitatRural.sln
        msbuild HabitatRural.sln /p:Configuration=Debug /p:Platform="Any CPU"

    - name: Publish
      run: >
        dotnet publish HabitatRural/HabitatRural.csproj
        -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o publish/HabitatRural

    - name: Copy Assets (PDF Templates)
      run: xcopy /E /I HabitatRural\Assets publish\HabitatRural\Assets

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HabitatRural-v3-win-x64
        path: publish/HabitatRural/
        retention-days: 90

    - name: GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: publish/HabitatRural/HabitatRural.exe
        body: |
          ## نظام ملاحق المساعدة الريفية ${{ github.ref_name }}
          **المطوّر:** حميتي نسيم الحوضان — nas.hamiti89@gmail.com
          ### الجديد
          - قاعدة بيانات SQLite لحفظ المستفيدين
          - بحث بآخر 5 أرقام من Code bénéficiaire
          - حفظ الملحق باسم المستفيد + الشطر (S1/S2/S1S2)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
