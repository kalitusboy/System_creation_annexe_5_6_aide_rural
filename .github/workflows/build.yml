name: Build WPF Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore HabitatRural/HabitatRural.csproj
    - name: Build
      run: dotnet build HabitatRural/HabitatRural.csproj --configuration Release --no-restore
    - name: Publish self-contained
      run: dotnet publish HabitatRural/HabitatRural.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HabitatRural
        path: ./publish/HabitatRural.exe
